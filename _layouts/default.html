<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ff5c9a%22/><text x=%2250%25%22 y=%2262%25%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>K</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">K</span>
        <span class="brand-text">Kh</span>
      </a>

      <nav class="site-nav" id="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Beranda</a>
        <a href="{{ '/' | relative_url }}#kategori">Kategori</a>
      </nav>

      <button class="menu-toggle" id="menu-toggle" aria-label="Buka menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <div class="brand footer-brand">
          <span class="brand-mark">K</span>
          <span class="brand-text">Kh</span>
        </div>
        <p>Koleksi game Java J2ME hasil terjemahan ke Bahasa Indonesia.</p>
      </div>
      <div>
        <h4>Jelajahi</h4>
        <a href="{{ '/' | relative_url }}">Beranda</a>
        <a href="{{ '/' | relative_url }}#kategori">Kategori</a>
      </div>
      <div>
        <h4>Ikuti Kami</h4>
        <a class="social-icon" href="https://www.facebook.com/profile.php?id=61592014025326" target="_blank" rel="noopener" aria-label="Facebook Kh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>
        </a>
      </div>
    </div>
    <div class="wrap footer-bottom">
      © 2026 Nabilla-Khanza. Dibuat dengan ♥️
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
