<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIT UPLOADER PRO — Neo Brutalist</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<style>
  :root{
    --bg:#FFF8E7; --ink:#0A0A0A;
    --yellow:#FFE14D; --pink:#FF6EC7; --cyan:#4DE1FF;
    --lime:#B8FF5C; --red:#FF4D4D; --orange:#FF9F1C;
    --purple:#B69CFF;
    --white:#FFFFFF; --gray:#F0F0F0;
    --border:3px solid var(--ink);
    --shadow:6px 6px 0 var(--ink);
    --shadow-sm:4px 4px 0 var(--ink);
    --shadow-xs:2px 2px 0 var(--ink);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:18px 14px 80px;
    background:var(--bg);
    background-image:radial-gradient(var(--ink) 1px, transparent 1px);
    background-size:16px 16px;
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--ink); min-height:100vh;
  }
  .wrap{max-width:720px; margin:0 auto;}

  /* HEADER */
  header{
    background:var(--yellow); border:var(--border);
    box-shadow:var(--shadow); padding:16px 18px;
    margin-bottom:22px; transform:rotate(-1deg); position:relative;
  }
  header h1{
    font-family:'Archivo Black', sans-serif; font-size:26px;
    line-height:1; margin:0; letter-spacing:-0.5px; text-transform:uppercase;
  }
  header h1 span{
    background:var(--ink); color:var(--yellow);
    padding:2px 8px; display:inline-block; transform:rotate(2deg);
  }
  header p{margin:8px 0 0; font-size:13px; font-weight:500;}
  header .badge{
    position:absolute; top:-14px; right:-10px;
    background:var(--pink); border:var(--border);
    font-family:'Archivo Black', sans-serif; font-size:11px;
    padding:4px 8px; transform:rotate(8deg); box-shadow:3px 3px 0 var(--ink);
  }

  /* CARD */
  .card{
    background:var(--white); border:var(--border);
    box-shadow:var(--shadow); padding:16px;
    margin-bottom:18px; position:relative;
  }
  .card-title{
    font-family:'Archivo Black', sans-serif; font-size:14px;
    text-transform:uppercase; letter-spacing:0.5px;
    margin:0 0 14px; display:flex; align-items:center; gap:8px;
    padding-bottom:10px; border-bottom:var(--border);
    flex-wrap:wrap;
  }
  .card-title .num{
    background:var(--ink); color:var(--yellow);
    width:24px; height:24px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; flex-shrink:0;
  }
  .card-title .actions{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}
  .mini-btn{
    background:var(--white); border:2px solid var(--ink);
    padding:4px 8px; font-family:'Space Grotesk', sans-serif;
    font-size:10px; font-weight:700; text-transform:uppercase;
    cursor:pointer; box-shadow:2px 2px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
    display:inline-flex; align-items:center; gap:4px;
  }
  .mini-btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink);}
  .mini-btn.pink{background:var(--pink);}
  .mini-btn.lime{background:var(--lime);}
  .mini-btn.cyan{background:var(--cyan);}
  .mini-btn.purple{background:var(--purple);}

  /* FIELD */
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block; font-weight:700; font-size:12px;
    text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;
  }
  label .hint{
    font-weight:400; text-transform:none; letter-spacing:0;
    color:#666; font-size:11px;
  }
  input[type="text"], input[type="password"]{
    width:100%; padding:11px 12px;
    font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:500;
    background:var(--white); color:var(--ink);
    border:var(--border); outline:none;
    transition:transform .08s, box-shadow .08s, background .08s;
  }
  input:focus{
    background:var(--cyan); box-shadow:var(--shadow-sm);
    transform:translate(-2px,-2px);
  }
  input::placeholder{color:#999; font-weight:400;}

  .input-wrap{position:relative;}
  .toggle-token{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; cursor:pointer; padding:4px;
    display:flex; align-items:center;
  }

  /* DROP ZONE */
  .dropzone{
    border:3px dashed var(--ink); background:var(--gray);
    padding:24px 16px; text-align:center; cursor:pointer;
    transition:all .15s; position:relative;
  }
  .dropzone:hover, .dropzone.drag{
    background:var(--cyan); border-style:solid;
    transform:translate(-2px,-2px); box-shadow:var(--shadow-sm);
  }
  .dropzone .dz-icon{
    width:44px; height:44px; margin:0 auto 10px;
    background:var(--yellow); border:var(--border);
    display:flex; align-items:center; justify-content:center;
    box-shadow:3px 3px 0 var(--ink);
  }
  .dropzone .dz-title{
    font-family:'Archivo Black', sans-serif;
    font-size:14px; text-transform:uppercase; margin-bottom:4px;
  }
  .dropzone .dz-sub{font-size:11px; color:#555;}
  .dropzone input{display:none;}

  /* QUEUE */
  .queue{margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .queue-item{
    border:2px solid var(--ink); background:var(--white);
    padding:10px; box-shadow:2px 2px 0 var(--ink);
    animation:slideIn .2s;
  }
  @keyframes slideIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;}}
  .queue-item.done{background:#EAFAD9;}
  .queue-item.err{background:#FFDCDC;}
  .queue-item.active{background:var(--yellow);}
  .queue-item.cancelled{background:#EEE; opacity:.7;}

  .queue-top{
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:10px; align-items:center;
  }
  .queue-thumb{
    width:44px; height:44px;
    border:2px solid var(--ink); background:var(--gray);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0;
  }
  .queue-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .queue-thumb .icon{width:22px; height:22px; stroke-width:2.5;}

  .queue-info{min-width:0;}
  .queue-name{
    font-weight:700; font-size:13px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .queue-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:#555; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .queue-status{
    font-family:'Archivo Black', sans-serif;
    font-size:10px; text-transform:uppercase;
    text-align:center; min-width:52px; padding:4px 6px;
    border:2px solid var(--ink); background:var(--white);
  }
  .queue-item.active .queue-status{background:var(--orange);}
  .queue-item.done .queue-status{background:var(--lime);}
  .queue-item.err .queue-status{background:var(--red); color:var(--white);}
  .queue-item.cancelled .queue-status{background:#ccc;}

  .queue-bar-wrap{
    height:10px; background:var(--white);
    border:2px solid var(--ink); margin-top:8px;
    overflow:hidden; display:none;
  }
  .queue-item.active .queue-bar-wrap,
  .queue-item.done .queue-bar-wrap,
  .queue-item.err .queue-bar-wrap,
  .queue-item.cancelled .queue-bar-wrap{display:block;}
  .queue-bar{
    height:100%; width:0%;
    background:repeating-linear-gradient(45deg, var(--pink) 0 8px, var(--yellow) 8px 16px);
    transition:width .15s linear;
  }
  .queue-item.done .queue-bar{background:var(--lime);}
  .queue-item.err .queue-bar{background:var(--red);}
  .queue-item.cancelled .queue-bar{background:#999;}

  /* PER-FILE FOLDER INPUT */
  .queue-folder{
    margin-top:8px;
    display:flex; align-items:center; gap:0;
    border:2px solid var(--ink); background:var(--white);
    box-shadow:2px 2px 0 var(--ink);
  }
  .queue-folder .prefix{
    background:var(--purple); border-right:2px solid var(--ink);
    padding:6px 8px; font-size:12px;
    display:flex; align-items:center; gap:4px;
    font-family:'JetBrains Mono', monospace; font-weight:700;
    flex-shrink:0;
  }
  .queue-folder input{
    flex:1; min-width:0;
    border:none !important; box-shadow:none !important;
    padding:6px 8px !important; font-size:12px !important;
    font-family:'JetBrains Mono', monospace !important;
    background:transparent !important; outline:none;
  }
  .queue-folder input:focus{background:var(--cyan) !important;}
  .queue-item.active .queue-folder,
  .queue-item.done .queue-folder,
  .queue-item.err .queue-folder,
  .queue-item.cancelled .queue-folder{
    opacity:.6; pointer-events:none;
  }

  .queue-remove{
    background:var(--white); border:2px solid var(--ink);
    cursor:pointer; padding:3px; display:inline-flex;
    box-shadow:2px 2px 0 var(--ink);
  }
  .queue-remove:active{transform:translate(2px,2px); box-shadow:none;}

  /* FOLDER TOOLS */
  .folder-tools{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-top:10px; padding-top:10px;
    border-top:2px dashed #999;
  }
  .folder-tools .mini-btn{font-size:10px;}

  /* OVERALL */
  .overall{
    margin-top:14px; padding:12px;
    border:var(--border); background:var(--white);
    box-shadow:var(--shadow-xs); display:none;
  }
  .overall.show{display:block;}
  .overall-head{
    display:flex; justify-content:space-between; align-items:center;
    font-weight:700; font-size:12px; text-transform:uppercase; margin-bottom:8px;
  }
  .overall-bar-wrap{
    height:16px; background:var(--white);
    border:2px solid var(--ink); overflow:hidden;
  }
  .overall-bar{
    height:100%; width:0%;
    background:repeating-linear-gradient(45deg, var(--cyan) 0 12px, var(--lime) 12px 24px);
    transition:width .2s;
  }
  .overall-stats{
    display:flex; gap:10px; margin-top:8px;
    font-family:'JetBrains Mono', monospace; font-size:11px; flex-wrap:wrap;
  }
  .overall-stats span{
    background:var(--gray); padding:2px 6px; border:1px solid var(--ink);
  }
  .overall-stats .ok{background:var(--lime);}
  .overall-stats .err{background:var(--red); color:var(--white);}
  .overall-stats .spd{background:var(--cyan);}

  /* BUTTON */
  .btn-row{display:flex; gap:10px; margin-top:4px;}
  .btn{
    flex:1; padding:16px;
    font-family:'Archivo Black', sans-serif;
    font-size:15px; text-transform:uppercase; letter-spacing:1px;
    background:var(--lime); color:var(--ink);
    border:var(--border); box-shadow:var(--shadow);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:hover{background:var(--yellow);}
  .btn:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink);}
  .btn:disabled{background:#DDD; cursor:not-allowed; color:#888; box-shadow:var(--shadow-sm);}
  .btn.danger{background:var(--red); color:var(--white); flex:0 0 auto; padding:16px;}
  .btn.danger:hover{background:#E03030;}

  /* LOG */
  .log{
    background:var(--ink); color:var(--lime);
    border:var(--border); box-shadow:var(--shadow-sm);
    padding:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; line-height:1.7;
    white-space:pre-wrap; word-break:break-word;
    max-height:220px; overflow-y:auto;
    display:none; margin-top:12px;
  }
  .log.show{display:block;}
  .log .ok{color:var(--lime);}
  .log .err{color:var(--red);}
  .log .info{color:var(--cyan);}
  .log .warn{color:var(--orange);}

  /* TOAST */
  .toast-wrap{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    z-index:9999; display:flex; flex-direction:column; gap:8px;
    pointer-events:none; width:calc(100% - 28px); max-width:400px;
  }
  .toast{
    background:var(--white); border:var(--border);
    box-shadow:var(--shadow-sm); padding:12px 14px;
    font-weight:700; font-size:13px;
    display:flex; align-items:center; gap:10px;
    animation:toastIn .25s; pointer-events:auto;
  }
  .toast.ok{background:var(--lime);}
  .toast.err{background:var(--red); color:var(--white);}
  .toast.info{background:var(--cyan);}
  .toast.warn{background:var(--yellow);}
  @keyframes toastIn{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;}}

  footer{
    text-align:center; font-size:11px; font-weight:500;
    margin-top:30px; padding:10px;
    text-transform:uppercase; letter-spacing:1px;
  }
  footer span{background:var(--ink); color:var(--yellow); padding:3px 8px;}

  .icon{width:18px; height:18px; stroke-width:3;}
  .icon-sm{width:14px; height:14px; stroke-width:3;}

  .repo-link{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:10px; font-size:12px; font-weight:700;
    text-decoration:none; color:var(--ink);
    background:var(--cyan); padding:5px 10px;
    border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink);
  }
  .repo-link:active{transform:translate(2px,2px); box-shadow:none;}

  @media (max-width:400px){
    header h1{font-size:20px;}
    .btn{font-size:13px; padding:14px;}
    .queue-top{grid-template-columns:36px 1fr auto; gap:8px;}
    .queue-thumb{width:36px; height:36px;}
    .queue-status{font-size:9px; min-width:44px;}
  }
.remember{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;margin:0 0 14px;text-transform:none;cursor:pointer}.remember input{width:20px;height:20px;accent-color:#0A0A0A;flex-shrink:0}
</style>
</head>
<body>

<div class="toast-wrap" id="toasts"></div>

<div class="wrap">

  <header>
    <div class="badge">NO TERMUX</div>
    <h1>GIT<br><span>UPLOADER</span></h1>
    <p>Upload ke GitHub dari HP. Atur folder per file biar repo tetap rapi.</p>
  </header>

  <!-- STEP 1: CONFIG -->
  <div class="card">
    <h2 class="card-title">
      <span class="num">1</span> Konfigurasi
      <div class="actions">
        <button class="mini-btn pink" onclick="clearConfig()">
          <i data-lucide="rotate-ccw" class="icon-sm"></i> Reset
        </button>
      </div>
    </h2>

    <div class="field">
      <label>Token GitHub <span class="hint">(ghp_... / github_pat_...)</span></label>
      <div class="input-wrap">
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
        <button type="button" class="toggle-token" onclick="toggleToken()">
          <i data-lucide="eye" class="icon"></i>
        </button>
      </div>
    </div>

    <label class="remember"><input type="checkbox" id="rememberToken"> Ingat token di perangkat ini <span class="hint">(hanya di browser ini; jangan di HP/komputer umum)</span></label>

    <div class="field">
      <label>Username</label>
      <input type="text" id="user" placeholder="username-kamu" autocomplete="off">
    </div>

    <div class="field">
      <label>Repository</label>
      <input type="text" id="repo" placeholder="nama-repo" autocomplete="off">
    </div>

    <div class="field">
      <label>Folder Default <span class="hint">(dipakai untuk file baru)</span></label>
      <input type="text" id="folder" placeholder="uploads" autocomplete="off">
    </div>

    <div class="field">
      <label>Branch <span class="hint">(kosong = branch default repo)</span></label>
      <input type="text" id="branch" placeholder="main" autocomplete="off">
    </div>

    <a href="#" id="repoLink" class="repo-link" style="display:none" target="_blank" rel="noopener">
      <i data-lucide="external-link" class="icon-sm"></i> Buka repo
    </a>
  </div>

  <!-- STEP 2: FILES -->
  <div class="card">
    <h2 class="card-title">
      <span class="num">2</span> Pilih File
      <div class="actions">
        <button class="mini-btn" onclick="clearQueue()">
          <i data-lucide="trash-2" class="icon-sm"></i> Bersih
        </button>
      </div>
    </h2>

    <div class="dropzone" id="dropzone">
      <div class="dz-icon"><i data-lucide="upload-cloud" class="icon"></i></div>
      <div class="dz-title">TAP atau DROP FILE</div>
      <div class="dz-sub">Bisa pilih banyak file sekaligus</div>
      <input type="file" id="file" multiple>
    </div>

    <div class="queue" id="queue"></div>

    <!-- FOLDER TOOLS -->
    <div class="folder-tools" id="folderTools" style="display:none">
      <button class="mini-btn purple" onclick="applyDefaultFolder()">
        <i data-lucide="folder-input" class="icon-sm"></i> Pakai folder default
      </button>
      <button class="mini-btn cyan" onclick="autoCategorize()">
        <i data-lucide="wand-2" class="icon-sm"></i> Auto kategori
      </button>
      <button class="mini-btn lime" onclick="clearAllFolders()">
        <i data-lucide="folder-minus" class="icon-sm"></i> Kosongkan folder
      </button>
    </div>

    <div class="overall" id="overall">
      <div class="overall-head">
        <span>Total Progress</span>
        <span id="overallPct">0%</span>
      </div>
      <div class="overall-bar-wrap"><div class="overall-bar" id="overallBar"></div></div>
      <div class="overall-stats">
        <span id="statCount">0 file</span>
        <span class="ok" id="statOk">0 OK</span>
        <span class="err" id="statErr">0 gagal</span>
        <span class="spd" id="statSpeed">0 KB/s</span>
      </div>
    </div>
  </div>

  <!-- STEP 3: UPLOAD -->
  <div class="card">
    <h2 class="card-title"><span class="num">3</span> Upload</h2>
    <div class="btn-row">
      <button class="btn" id="btnUpload" onclick="startUpload()">
        <i data-lucide="rocket" class="icon"></i>
        <span id="btnText">Mulai Upload</span>
      </button>
      <button class="btn danger" id="btnCancel" onclick="cancelUpload()" style="display:none;">
        <i data-lucide="x" class="icon"></i>
      </button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <footer><span>Neo Brutalist · CDN · No Termux</span></footer>
</div>

<script>
function refreshIcons(){ try{ if(window.lucide) lucide.createIcons(); }catch(e){} }
const DEFAULTS = { user:'nabilla099', repo:'nabilla099.github.io', folder:'', branch:'main' };
const MAX_BYTES = 100*1024*1024;
function ghUrl(user, repo, path){
  return `https://api.github.com/repos/${encodeURIComponent(user)}/${encodeURIComponent(repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
}
function ghHeaders(token){
  return { 'Authorization':`Bearer ${token}`, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
}
function friendlyErr(status, msg){
  if(status===401) return 'Token salah / kedaluwarsa (401)';
  if(status===403) return 'Ditolak (403): token butuh izin Contents = Read & write, atau kena rate limit';
  if(status===404) return 'Repo/branch tidak ditemukan, atau token tak punya akses (404)';
  return msg || ('HTTP '+status);
}
/* ============================================================
   INIT
============================================================ */
const $ = id => document.getElementById(id);
const els = {
  token:$('token'), user:$('user'), repo:$('repo'), folder:$('folder'), branch:$('branch'), remember:$('rememberToken'),
  file:$('file'), dropzone:$('dropzone'), queue:$('queue'),
  folderTools:$('folderTools'),
  overall:$('overall'), overallBar:$('overallBar'), overallPct:$('overallPct'),
  statCount:$('statCount'), statOk:$('statOk'), statErr:$('statErr'), statSpeed:$('statSpeed'),
  log:$('log'), btnUpload:$('btnUpload'), btnCancel:$('btnCancel'), btnText:$('btnText'),
  repoLink:$('repoLink')
};

/* ============================================================
   STATE
============================================================ */
let queueItems = [];
let isUploading = false;
let abortAll = false;
let currentXHR = null;
let uploadStartTime = 0;

/* ============================================================
   LOCALSTORAGE
============================================================ */
const LS_KEY = 'gh-uploader-cfg-v2';
function saveConfig(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      user: els.user.value.trim(),
      repo: els.repo.value.trim(),
      folder: els.folder.value.trim(),
      branch: els.branch.value.trim()
    }));
  }catch(e){}
  updateRepoLink();
}
function loadConfig(){
  try{
    try{
      const lt = localStorage.getItem('gh-up-token');
      const t = lt || sessionStorage.getItem('gh-up-token');
      if(t) els.token.value = t;
      els.remember.checked = !!lt;
    }catch(e){}
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){
      els.user.value = DEFAULTS.user; els.repo.value = DEFAULTS.repo;
      els.folder.value = DEFAULTS.folder; els.branch.value = DEFAULTS.branch;
      updateRepoLink(); return;
    }
    const cfg = JSON.parse(raw);
    if(cfg.user) els.user.value = cfg.user;
    if(cfg.repo) els.repo.value = cfg.repo;
    if(cfg.folder) els.folder.value = cfg.folder;
    if(cfg.branch) els.branch.value = cfg.branch;
    if(cfg.user && cfg.repo) toast('Config terakhir dimuat', 'info');
  }catch(e){}
  updateRepoLink();
}
function clearConfig(){
  try{ localStorage.removeItem(LS_KEY); sessionStorage.removeItem('gh-up-token'); localStorage.removeItem('gh-up-token'); els.remember.checked=false; }catch(e){}
  els.user.value=''; els.repo.value=''; els.folder.value=''; els.branch.value=''; els.token.value='';
  updateRepoLink(); toast('Config direset', 'warn');
}
function updateRepoLink(){
  const u = els.user.value.trim(), r = els.repo.value.trim();
  if(u && r){
    els.repoLink.href = `https://github.com/${u}/${r}`;
    els.repoLink.style.display = 'inline-flex';
  } else els.repoLink.style.display = 'none';
}
['user','repo','folder','branch'].forEach(k => els[k].addEventListener('input', saveConfig));

/* ============================================================
   TOKEN TOGGLE
============================================================ */
let tokenVisible = false;
function toggleToken(){
  tokenVisible = !tokenVisible;
  els.token.type = tokenVisible ? 'text' : 'password';
}

/* ============================================================
   TOAST
============================================================ */
function toast(msg, type='info', duration=2800){
  const wrap = $('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const iconMap = { ok:'check-circle-2', err:'alert-circle', info:'info', warn:'alert-triangle' };
  t.innerHTML = `<i data-lucide="${iconMap[type]||'info'}" class="icon"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(t);
  refreshIcons();
  setTimeout(() => {
    t.style.opacity='0'; t.style.transform='translateY(-10px)';
    t.style.transition='all .25s';
    setTimeout(()=>t.remove(), 300);
  }, duration);
}

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}
function formatSpeed(b){
  if(b<1024) return b.toFixed(0)+' B/s';
  if(b<1048576) return (b/1024).toFixed(1)+' KB/s';
  return (b/1048576).toFixed(2)+' MB/s';
}
function isImage(f){
  return (f.type||'').startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name);
}
function getFileIcon(f){
  const t = f.type||'', n = f.name.toLowerCase();
  if(isImage(f)) return 'file-image';
  if(t.startsWith('video/') || /\.(mp4|mov|avi|mkv|webm)$/.test(n)) return 'file-video';
  if(t.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac)$/.test(n)) return 'file-audio';
  if(/\.(zip|rar|7z|tar|gz)$/.test(n)) return 'file-archive';
  if(/\.(js|ts|jsx|tsx|py|java|c|cpp|go|rb|php|html|css|json|xml|yml|yaml|sh)$/.test(n)) return 'file-code';
  if(/\.(pdf)$/.test(n)) return 'file-text';
  if(/\.(txt|md|log|csv)$/.test(n)) return 'file-text';
  return 'file';
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function cleanFolder(s){ return String(s||'').trim().replace(/\\/g,'/').replace(/^\/+|\/+$/g,'').replace(/\/+/g,'/'); }

/* Auto-suggest folder per tipe file */
function suggestFolder(f){
  const n = f.name.toLowerCase(), t = f.type||'';
  if(isImage(f)) return 'images';
  if(t.startsWith('video/') || /\.(mp4|mov|avi|mkv|webm)$/.test(n)) return 'videos';
  if(t.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac)$/.test(n)) return 'audio';
  if(/\.(zip|rar|7z|tar|gz)$/.test(n)) return 'archives';
  if(/\.(pdf)$/.test(n)) return 'documents';
  if(/\.(txt|md|log|csv|docx?|xlsx?|pptx?)$/.test(n)) return 'documents';
  if(/\.(js|ts|jsx|tsx|py|java|c|cpp|go|rb|php|html|css|json|xml|yml|yaml|sh)$/.test(n)) return 'code';
  return '';
}

/* ============================================================
   DROPZONE
============================================================ */
els.dropzone.addEventListener('click', () => els.file.click());
els.file.addEventListener('change', e => addFiles(e.target.files));
['dragenter','dragover'].forEach(ev => {
  els.dropzone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    els.dropzone.classList.add('drag');
  });
});
['dragleave','drop'].forEach(ev => {
  els.dropzone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    els.dropzone.classList.remove('drag');
  });
});
els.dropzone.addEventListener('drop', e => {
  if(e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ============================================================
   QUEUE
============================================================ */
function addFiles(fileList){
  const defFolder = cleanFolder(els.folder.value);
  for(const f of fileList){
    queueItems.push({
      id: uid(),
      file: f,
      status: 'idle',
      progress: 0,
      folder: defFolder,
      path: '',
      error: '',
      loaded: 0,
      total: 0
    });
  }
  renderQueue();
  toast(`${fileList.length} file ditambahkan`, 'info', 1500);
}

function renderQueue(){
  els.queue.innerHTML = '';
  if(queueItems.length === 0){
    els.folderTools.style.display = 'none';
    updateOverall();
    return;
  }
  els.folderTools.style.display = 'flex';

  queueItems.forEach(item => {
    els.queue.appendChild(buildQueueItem(item));
  });
  refreshIcons();
  updateOverall();
}

function buildQueueItem(item){
  const f = item.file;
  const div = document.createElement('div');
  div.className = 'queue-item ' + statusClass(item.status);
  div.dataset.id = item.id;

  // TOP ROW
  const top = document.createElement('div');
  top.className = 'queue-top';

  const thumb = document.createElement('div');
  thumb.className = 'queue-thumb';
  if(isImage(f) && f.size < 3_000_000){
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.onload = () => URL.revokeObjectURL(img.src);
    thumb.appendChild(img);
  } else {
    thumb.innerHTML = `<i data-lucide="${getFileIcon(f)}" class="icon"></i>`;
  }

  const info = document.createElement('div');
  info.className = 'queue-info';
  info.innerHTML = `
    <div class="queue-name">${escapeHtml(f.name)}</div>
    <div class="queue-meta">${formatSize(f.size)}</div>
  `;

  const statusDiv = document.createElement('div');
  statusDiv.className = 'queue-status';
  statusDiv.textContent = statusLabel(item);

  top.appendChild(thumb);
  top.appendChild(info);
  top.appendChild(statusDiv);
  div.appendChild(top);

  // PROGRESS BAR
  const barWrap = document.createElement('div');
  barWrap.className = 'queue-bar-wrap';
  const bar = document.createElement('div');
  bar.className = 'queue-bar';
  bar.style.width = item.progress + '%';
  barWrap.appendChild(bar);
  div.appendChild(barWrap);

  // FOLDER INPUT
  const folderBox = document.createElement('div');
  folderBox.className = 'queue-folder';
  folderBox.innerHTML = `
    <div class="prefix"><i data-lucide="folder" class="icon-sm"></i> repo/</div>
    <input type="text" placeholder="(root)" value="${escapeHtml(item.folder)}" data-folder-id="${item.id}">
  `;
  div.appendChild(folderBox);

  // REMOVE BUTTON (only when idle)
  if(item.status === 'idle' && !isUploading){
    const removeBtn = document.createElement('button');
    removeBtn.className = 'queue-remove';
    removeBtn.style.marginTop = '8px';
    removeBtn.innerHTML = `<i data-lucide="x" class="icon-sm"></i>`;
    removeBtn.title = 'Hapus dari antrian';
    removeBtn.onclick = () => removeItem(item.id);
    div.appendChild(removeBtn);
  }

  // bind folder input
  const folderInput = folderBox.querySelector('input');
  folderInput.addEventListener('input', e => {
    const it = queueItems.find(x => x.id === item.id);
    if(it) it.folder = e.target.value;
  });
  folderInput.addEventListener('blur', e => {
    const it = queueItems.find(x => x.id === item.id);
    if(it) it.folder = cleanFolder(e.target.value);
    e.target.value = it ? it.folder : '';
  });

  return div;
}

function statusClass(s){
  return s === 'active' ? 'active' : s === 'done' ? 'done' :
         s === 'err' ? 'err' : s === 'cancelled' ? 'cancelled' : '';
}
function statusLabel(item){
  const map = { idle:'Ready', active:'↑ '+Math.round(item.progress)+'%',
    done:'OK', err:'Gagal', cancelled:'Batal' };
  return map[item.status] || item.status;
}

/* Update 1 item saja tanpa rebuild (biar input folder gak kehilangan fokus) */
function updateItemUI(item){
  const el = els.queue.querySelector(`[data-id="${item.id}"]`);
  if(!el) return;
  el.className = 'queue-item ' + statusClass(item.status);
  const statusDiv = el.querySelector('.queue-status');
  if(statusDiv) statusDiv.textContent = statusLabel(item);
  const bar = el.querySelector('.queue-bar');
  if(bar) bar.style.width = item.progress + '%';
  const meta = el.querySelector('.queue-meta');
  if(meta){
    meta.textContent = item.status === 'active'
      ? `${formatSize(item.loaded)} / ${formatSize(item.total)}`
      : item.status === 'err'
        ? item.error
        : formatSize(item.file.size);
  }
}

function removeItem(id){
  if(isUploading) return;
  queueItems = queueItems.filter(x => x.id !== id);
  renderQueue();
}

function clearQueue(){
  if(isUploading){ toast('Sedang upload, cancel dulu', 'warn'); return; }
  queueItems = [];
  renderQueue();
  els.file.value = '';
}

/* ============================================================
   FOLDER TOOLS
============================================================ */
function applyDefaultFolder(){
  const def = cleanFolder(els.folder.value);
  queueItems.forEach(i => { if(i.status === 'idle') i.folder = def; });
  renderQueue();
  toast(`Folder default "${def || '(root)'}" diterapkan ke semua file`, 'info');
}

function autoCategorize(){
  let changed = 0;
  queueItems.forEach(i => {
    if(i.status !== 'idle') return;
    const s = suggestFolder(i.file);
    i.folder = s;
    changed++;
  });
  renderQueue();
  toast(`Auto kategori selesai untuk ${changed} file`, 'ok');
}

function clearAllFolders(){
  queueItems.forEach(i => { if(i.status === 'idle') i.folder = ''; });
  renderQueue();
  toast('Semua folder dikosongkan (upload ke root)', 'warn');
}

/* ============================================================
   OVERALL
============================================================ */
let uploadedBytesTotal = 0;

function updateOverall(){
  if(queueItems.length === 0){
    els.overall.classList.remove('show');
    return;
  }
  els.overall.classList.add('show');

  const done = queueItems.filter(i => i.status === 'done').length;
  const err  = queueItems.filter(i => i.status === 'err' || i.status === 'cancelled').length;

  let totalPct = 0;
  queueItems.forEach(i => {
    if(i.status === 'done' || i.status === 'err' || i.status === 'cancelled') totalPct += 100;
    else totalPct += i.progress;
  });
  const pct = Math.round(totalPct / queueItems.length);

  els.overallBar.style.width = pct + '%';
  els.overallPct.textContent = pct + '%';
  els.statCount.textContent = queueItems.length + ' file';
  els.statOk.textContent = done + ' OK';
  els.statErr.textContent = err + ' gagal';

  if(isUploading && uploadStartTime){
    const elapsed = (Date.now() - uploadStartTime) / 1000;
    if(elapsed > 0.5){
      els.statSpeed.textContent = formatSpeed(uploadedBytesTotal / elapsed);
    }
  } else {
    els.statSpeed.textContent = '0 KB/s';
  }
}

/* ============================================================
   LOG
============================================================ */
function log(msg, cls){
  els.log.classList.add('show');
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  els.log.appendChild(line);
  els.log.scrollTop = els.log.scrollHeight;
}
function clearLog(){ els.log.innerHTML = ''; els.log.classList.remove('show'); }

/* ============================================================
   FILE -> BASE64
============================================================ */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   XHR UPLOAD
============================================================ */
function uploadOneXHR({url, token, bodyObj, onProgress, signal}){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    currentXHR = xhr;
    xhr.open('PUT', url, true);
    xhr.setRequestHeader('Authorization', `Bearer ${token}`);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Accept', 'application/vnd.github+json');
    xhr.setRequestHeader('X-GitHub-Api-Version', '2022-11-28');

    xhr.upload.onprogress = e => {
      if(e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      let data = {};
      try{ data = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status >= 200 && xhr.status < 300) resolve(data);
      else { const er = new Error(friendlyErr(xhr.status, data.message)); er.status = xhr.status; reject(er); }
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.onabort = () => reject(new Error('__ABORTED__'));

    if(signal) signal.addEventListener('abort', () => { try{xhr.abort();}catch(e){} });
    xhr.send(JSON.stringify(bodyObj));
  });
}

/* ============================================================
   START UPLOAD
============================================================ */
async function startUpload(){
  if(isUploading) return;

  const token = els.token.value.trim();
  const user  = els.user.value.trim();
  const repo  = els.repo.value.trim();
  const branch = els.branch.value.trim();

  clearLog();
  if(!token){ toast('Token belum diisi', 'err'); return; }
  if(!user || !repo){ toast('Username / repo belum diisi', 'err'); return; }
  if(queueItems.length === 0){ toast('Belum ada file', 'err'); return; }
  if(!token.startsWith('ghp_') && !token.startsWith('github_pat_')){
    log('⚠ Token format aneh (harusnya ghp_ atau github_pat_)', 'warn');
  }

  // reset yang belum selesai
  queueItems.forEach(i => {
    if(i.status !== 'done'){
      i.status='idle'; i.progress=0; i.loaded=0; i.total=0; i.error=''; i.path='';
      i.folder = cleanFolder(i.folder);
    }
  });

  if(!queueItems.some(i => i.status !== 'done')){ toast('Semua file sudah terupload', 'info'); return; }
  saveConfig();
  try{ sessionStorage.setItem('gh-up-token', token); if(els.remember.checked) localStorage.setItem('gh-up-token', token); else localStorage.removeItem('gh-up-token'); }catch(e){}

  isUploading = true; abortAll = false;
  uploadStartTime = Date.now();
  uploadedBytesTotal = 0;
  els.btnUpload.disabled = true;
  els.btnText.textContent = 'Uploading...';
  els.btnCancel.style.display = 'flex';

  // rebuild supaya input folder disabled
  renderQueue();

  log(`🚀 Mulai upload ${queueItems.length} file ke ${user}/${repo}`, 'info');
  log('');

  let okCount = 0, failCount = 0;
  const pending = queueItems.filter(i => i.status !== 'done');

  for(let idx = 0; idx < pending.length; idx++){
    if(abortAll) break;
    const item = queueItems.find(x => x.id === pending[idx].id);
    const file = item.file;
    const folder = cleanFolder(item.folder);
    const path = folder ? `${folder}/${file.name}` : file.name;

    item.path = path;
    item.status = 'active';
    item.progress = 2;
    updateItemUI(item);

    log(`[${idx+1}/${pending.length}] → ${path} (${formatSize(file.size)})`, 'info');

    try{
      if(abortAll) throw new Error('__ABORTED__');
      if(file.size > MAX_BYTES) throw new Error('File > 100 MB (batas GitHub)');
      const base64 = await fileToBase64(file);
      const url = ghUrl(user, repo, path);
      const ref = branch ? `?ref=${encodeURIComponent(branch)}` : '';

      for(let attempt = 0; ; attempt++){
        if(abortAll) throw new Error('__ABORTED__');
        let sha;
        try{
          const head = await fetch(url + ref, { cache:'no-store', headers: ghHeaders(token) });
          if(head.ok){ const ex = await head.json(); if(ex && !Array.isArray(ex)) sha = ex.sha; }
          else if(head.status === 401) throw new Error(friendlyErr(401));
        }catch(e){ if(/401/.test(e.message)) throw e; }

        const body = { message: `upload ${file.name} via Git Uploader HP`, content: base64 };
        if(sha) body.sha = sha;
        if(branch) body.branch = branch;
        if(abortAll) throw new Error('__ABORTED__');
        item._lastLoaded = 0;
        try{
          await uploadOneXHR({
            url, token, bodyObj: body,
            onProgress: (loaded, total) => {
              const pct = Math.min(100, (loaded/total)*100);
              item.progress = 2 + (pct * 0.96);
              item.loaded = loaded; item.total = total;
              uploadedBytesTotal += Math.max(0, loaded - (item._lastLoaded||0));
              item._lastLoaded = loaded;
              updateItemUI(item); updateOverall();
            }
          });
          break;
        }catch(e){
          if((e.status === 409 || e.status === 422) && attempt < 2 && !abortAll){
            log('   ↻ konflik SHA, coba lagi...', 'warn'); continue;
          }
          throw e;
        }
      }

      item.status = 'done'; item.progress = 100;
      okCount++;
      log(`   ✅ Berhasil`, 'ok');
    }catch(err){
      if(err.message === '__ABORTED__' || abortAll){
        item.status = 'cancelled'; item.error = 'Dibatalkan';
        log(`   ⛔ Dibatalkan`, 'warn');
      } else {
        item.status = 'err'; item.error = err.message;
        failCount++;
        log(`   ❌ ${err.message}`, 'err');
      }
    }
    updateItemUI(item);
    updateOverall();
  }

  isUploading = false;
  currentXHR = null;
  els.btnUpload.disabled = false;
  els.btnText.textContent = 'Mulai Upload';
  els.btnCancel.style.display = 'none';
  renderQueue();

  log('');
  if(abortAll){
    log('⛔ Upload dibatalkan oleh user', 'warn');
    toast('Upload dibatalkan', 'warn');
  } else {
    log(`🏁 Selesai — ${okCount} berhasil, ${failCount} gagal`, failCount ? 'err' : 'ok');
    toast(`Selesai: ${okCount} OK${failCount ? `, ${failCount} gagal` : ''}`, failCount ? 'warn' : 'ok', 3500);
  }
  updateRepoLink();
}

/* ============================================================
   CANCEL
============================================================ */
function cancelUpload(){
  if(!isUploading) return;
  abortAll = true;
  try{ if(currentXHR) currentXHR.abort(); }catch(e){}
  toast('Membatalkan...', 'warn');
}

/* ============================================================
   BOOT
============================================================ */
loadConfig();
renderQueue();
refreshIcons();
</script>
