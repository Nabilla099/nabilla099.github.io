title: Kh
description: "Koleksi game Java J2ME hasil terjemahan ke Bahasa Indonesia."

# Konfigurasi kolom komentar (giscus). Isi setelah setup di giscus.app,
# lihat panduan lengkapnya di README.md bagian "Setup Komentar".
giscus:
  repo: "Nabilla099/nabilla099.github.io"
  repo_id: "GANTI_DENGAN_REPO_ID"
  category: "Comments"
  category_id: "GANTI_DENGAN_CATEGORY_ID"
baseurl: ""
url: ""

# Ganti "username" dengan username GitHub kamu, dan "repo" dengan nama repo-nya
# kalau situs ini dipasang di https://username.github.io/repo/
# Kalau situs ini dipasang langsung di https://username.github.io (repo bernama username.github.io),
# baseurl DIKOSONGKAN seperti di atas.

collections:
  games:
    output: true
    permalink: /game/:slug/

defaults:
  - scope:
      path: ""
      type: "games"
    values:
      layout: "game"

markdown: kramdown
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - add_game.sh
  - Gemfile
  - Gemfile.lock
